<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AF"/>
<meta name="theme-color" id="tc-meta" content="#0d0d1a"/>
<title>AF – Registro Ore</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=Noto+Sans+Arabic:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--red:#e74c3c;--red2:#c0392b;--blue:#3498db;--green:#2ecc71;--orange:#e67e22;--bg:#0d0d1a;--bg2:#16162a;--bg3:#1e1e38;--border:#2a2a48;--text:#e8e8f4;--muted:#6b6b8a;--shadow:0 2px 14px rgba(0,0,0,.45);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
body.light{--bg:#f0f2f8;--bg2:#fff;--bg3:#e8eaf2;--border:#d0d4e8;--text:#1a1a2e;--muted:#7880a0;--shadow:0 2px 14px rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Barlow',sans-serif;color:var(--text);display:flex;flex-direction:column;transition:background .2s,color .2s}
body.ar{font-family:'Noto Sans Arabic',sans-serif;direction:rtl}
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.lbox{background:var(--bg2);border-radius:20px;padding:28px 22px;width:100%;max-width:360px;border:1px solid var(--border);box-shadow:var(--shadow);position:relative}
.llogo{font-size:50px;font-weight:900;color:var(--red);letter-spacing:-3px;text-align:center;margin-bottom:3px}
.lco{text-align:center;font-size:11px;color:var(--muted);margin-bottom:22px;line-height:1.5}
.l-lang-btn{position:absolute;top:16px;right:16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit}
body.ar .l-lang-btn{right:auto;left:16px}
.ltabs{display:flex;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:18px}
.ltab{flex:1;padding:9px;font-size:12px;font-weight:700;border:none;border-radius:8px;background:none;color:var(--muted);cursor:pointer;font-family:inherit;transition:.2s}
.ltab.on{background:var(--red);color:#fff}
.lf{margin-bottom:13px}
.lf label{font-size:9px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.lf input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 13px;font-size:15px;font-family:inherit}
.lf input:focus{outline:none;border-color:var(--red)}
.lbtn{width:100%;background:var(--red);border:none;border-radius:12px;color:#fff;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:3px}
.lerr{color:var(--red);font-size:12px;text-align:center;margin-top:9px;min-height:18px}
.loff{text-align:center;margin-top:14px}
.loff button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit}
.fb-note{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-top:14px;font-size:10px;color:var(--muted);line-height:1.6}
.fb-note strong{color:var(--orange)}
.header{background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:2px solid var(--red);padding:calc(var(--st) + 10px) 14px 10px;flex-shrink:0}
.hrow1{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:32px;font-weight:900;color:var(--red);letter-spacing:-2px;line-height:1}
.logo-sub{font-size:10px;color:var(--muted);font-weight:500;margin-left:7px;vertical-align:middle}
body.ar .logo-sub{margin-left:0;margin-right:7px}
.hbtns{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ib{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:6px 9px;font-size:11px;cursor:pointer;font-family:inherit}
.co-line{font-size:10px;color:var(--muted);font-weight:600;margin-top:5px}
.hrow3{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.wbadge{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;border-radius:20px;padding:3px 11px;font-size:11px;font-weight:700;cursor:pointer}
.sdot{font-size:10px;color:var(--green)}
.mbar{background:var(--bg2);padding:9px 13px;display:flex;gap:7px;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.msel{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 9px;font-size:13px;font-family:inherit;flex:1;appearance:none;-webkit-appearance:none;min-width:70px}
.badd{background:var(--red);border:none;border-radius:8px;color:#fff;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.erow{display:flex;gap:6px;width:100%}
.ebtn{flex:1;border:1px solid;border-radius:8px;padding:7px 5px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;background:none;white-space:nowrap}
.ebtn.pdf{border-color:var(--red);color:var(--red)}.ebtn.xls{border-color:var(--green);color:var(--green)}.ebtn.bak{border-color:var(--muted);color:var(--muted)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:11px 11px calc(var(--sb)+11px)}
.scroll::-webkit-scrollbar{width:2px}.scroll::-webkit-scrollbar-thumb{background:var(--border)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}.empty .ei{font-size:50px;margin-bottom:12px}.empty p{font-size:14px;line-height:1.7}
.otbar{background:#e74c3c18;border:1px solid #e74c3c40;border-radius:10px;padding:10px 13px;margin-bottom:9px;display:flex;justify-content:space-between}
.otbi label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block}.otbi .otv{font-size:15px;font-weight:900}
.dc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)}
.dc.ot{border-color:#e74c3c50}
.dc.off{border-color:#5dade260;background:linear-gradient(135deg,var(--bg2),#5dade215)}
.dc.off .dc-h{background:linear-gradient(90deg,#5dade220,var(--bg3))}
.dc.off .dc-date{color:#5dade2}
.off-badge{display:inline-flex;align-items:center;gap:4px;background:#5dade220;color:#5dade2;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;margin-top:2px}
.dc-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--bg3);border-bottom:1px solid var(--border)}
.dc-date{font-size:13px;font-weight:700}.dc-day{font-size:10px;color:var(--muted);margin-top:1px}
.dc-acts{display:flex;gap:2px}
.dca{background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:16px;cursor:pointer;padding:6px 10px;color:var(--muted);line-height:1;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.dca:active{opacity:.6}
.dc-b{padding:9px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.ds label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:2px}
.ds .v{font-size:13px;font-weight:700}.vt{color:var(--text)}.vh{color:#5dade2}.vh.ot{color:var(--red)}.ve{color:var(--green)}
.otchip{display:inline-block;background:#e74c3c20;color:var(--red);border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;margin-top:2px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.tcard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px;text-align:center;box-shadow:var(--shadow)}
.tcard.acc{border-color:#e74c3c44}
.tcard label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px}
.tcard .big{font-size:23px;font-weight:900;line-height:1}.tcard .sub{font-size:9px;color:var(--muted);margin-top:3px}
.tc-days .big{color:var(--green)}.tc-h .big{color:#5dade2}.tc-ot .big{color:var(--orange)}.tc-m .big{color:var(--red)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:flex-end;z-index:300}
.sh{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;padding:17px 17px calc(var(--sb)+17px);border-top:2px solid var(--red);max-height:93vh;overflow-y:auto}
.handle{width:34px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 15px}
.sh-title{font-size:17px;font-weight:800;margin-bottom:15px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ff{grid-column:1/-1}
.fld label{font-size:9px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fld input,.fld select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 12px;font-size:15px;font-family:inherit;appearance:none;-webkit-appearance:none}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--red)}
.pvbox{background:var(--bg);border-radius:10px;padding:11px 13px;display:flex;justify-content:space-around;margin:11px 0}
.pvbox span{font-size:12px;color:var(--muted)}
.off-warn{background:#5dade220;border:1px solid #5dade240;border-radius:10px;padding:10px 13px;margin-bottom:10px;font-size:13px;color:#5dade2;text-align:center;display:none}
.off-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.off-toggle label{font-size:13px;font-weight:600;cursor:pointer}
.brow{display:flex;gap:8px;margin-top:3px}
.bsave{background:var(--red);border:none;border-radius:12px;color:#fff;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;flex:1}
.bcancel{background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--muted);padding:13px 16px;font-size:15px;cursor:pointer;font-family:inherit}
.wlist{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
.wi{display:flex;justify-content:space-between;align-items:center;background:var(--bg3);border-radius:10px;padding:10px 13px;border:1px solid var(--border);cursor:pointer}
.wi.sel{border-color:var(--red)}.wi .wn{font-size:14px;font-weight:700}.wi .wr{font-size:11px;color:var(--muted)}
.wi-btns{display:flex;gap:6px;align-items:center}
.wia{background:var(--bg);border:1px solid var(--border);border-radius:7px;font-size:14px;cursor:pointer;color:var(--muted);padding:5px 8px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
.wadd{background:var(--bg3);border:1px dashed var(--border);border-radius:10px;color:var(--muted);padding:12px;width:100%;font-size:13px;cursor:pointer;font-family:inherit}
.stgr{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.stgi{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;font-size:14px;width:100px;font-family:inherit;text-align:center;appearance:none}
.tog{position:relative;width:42px;height:23px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:var(--border);border-radius:12px;transition:.25s;cursor:pointer}
.tsl:before{content:'';position:absolute;width:17px;height:17px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
input:checked+.tsl{background:var(--red)}input:checked+.tsl:before{transform:translateX(19px)}
.bbtn{display:block;width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:9px;border:none;text-align:center}
.bb-exp{background:var(--blue);color:#fff}.bb-imp{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.confirm-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.confirm-box{background:var(--bg2);border-radius:16px;padding:24px 20px;width:100%;max-width:300px;border:1px solid var(--border);text-align:center}
.confirm-box .cm{font-size:14px;line-height:1.6;margin-bottom:20px}
.confirm-box .crow{display:flex;gap:10px}
.cbtn-ok{flex:1;background:var(--red);border:none;border-radius:10px;color:#fff;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.cbtn-no{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--muted);padding:12px;font-size:14px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="login-screen">
<div class="lbox">
<button class="l-lang-btn" id="l-lang-btn" onclick="toggleLangLogin()">🇸🇦 AR</button>
<div class="llogo">AF</div>
<div class="lco">Arti Grafiche M. &amp; G. Pirovano<br/><span style="font-size:10px">Ahmed Farag</span></div>
<div class="ltabs">
<button class="ltab on" id="tab-li" onclick="swTab('li')">Sign In</button>
<button class="ltab" id="tab-su" onclick="swTab('su')">Register</button>
</div>
<div class="lf"><label>Email</label><input type="email" id="l-em" placeholder="email@example.com" autocomplete="email"/></div>
<div class="lf"><label>Password</label><input type="password" id="l-pw" placeholder="••••••••" autocomplete="current-password"/></div>
<div class="lf" id="l-pw2w" style="display:none"><label id="l-pw2-lbl">Confirm Password</label><input type="password" id="l-pw2" placeholder="••••••••"/></div>
<button class="lbtn" id="l-btn" onclick="doAuth()">Sign In</button>
<div class="lerr" id="l-err"></div>
<div class="loff"><button onclick="goOffline()" id="l-off-btn">Continue offline</button></div>
<div class="fb-note" id="fb-note"><strong>✅ Online:</strong> Firebase connected.</div>
</div>
</div>
<div id="aw" style="display:none;flex:1;flex-direction:column;height:100%">
<div class="header">
<div class="hrow1">
<div class="logo">AF <span class="logo-sub" id="hd-sub">Registro Ore</span></div>
<div class="hbtns">
<button class="ib" onclick="toggleLang()" id="btn-lang">🇸🇦 AR</button>
<button class="ib" onclick="toggleTheme()" id="btn-theme">☀️</button>
<button class="ib" onclick="openSettings()">⚙️</button>
<button class="ib" onclick="doOut()">🚪</button>
</div>
</div>
<div class="co-line">Arti Grafiche M. &amp; G. Pirovano</div>
<div class="hrow3">
<div class="wbadge" onclick="openWorkers()" id="wbadge">👤 Ahmed Farag ▾</div>
<span id="sdot" class="sdot"></span>
</div>
</div>
<div class="mbar">
<select class="msel" id="sel-month" onchange="renderAll()"></select>
<select class="msel" id="sel-year" onchange="renderAll()" style="flex:0 0 72px"></select>
<button class="badd" onclick="openForm(null)" id="btn-add">＋ Giorno</button>
<div class="erow" id="erow" style="display:none">
<button class="ebtn pdf" onclick="exportPDF()" id="btn-pdf">📄 PDF</button>
<button class="ebtn xls" onclick="exportCSV()" id="btn-xls">📊 Excel</button>
<button class="ebtn bak" onclick="openBackup()" id="btn-bak">💾 Backup</button>
</div>
</div>
<div class="scroll" id="main-area"></div>
</div>
<div class="ov" id="form-modal" style="display:none">
<div class="sh">
<div class="handle"></div>
<div class="sh-title" id="fm-t">Aggiungi Giorno</div>
<div class="off-warn" id="off-warn">Day Off</div>
<div class="off-toggle">
<label for="f-off" id="f-off-lbl">Day Off / Giorno di Riposo</label>
<label class="tog"><input type="checkbox" id="f-off" onchange="toggleOffDay()"/><span class="tsl"></span></label>
</div>
<div id="work-fields">
<div class="fg">
<div class="fld ff"><label id="lfd">Data</label><input type="date" id="f-d" oninput="upPv()"/></div>
<div class="fld"><label id="lfi">Entrata</label><input type="time" id="f-i" value="08:00" oninput="upPv()"/></div>
<div class="fld"><label id="lfo">Uscita</label><input type="time" id="f-o" value="19:00" oninput="upPv()"/></div>
<div class="fld ff"><label id="lfp">Pausa</label>
<select id="f-p" onchange="upPv()">
<option value="0">Senza</option>
<option value="0.5">30 min</option>
<option value="1" selected>1 ora</option>
</select>
</div>
<div class="fld ff"><label id="lfr">€/Ora</label><input type="number" step="0.0001" id="f-r" placeholder="7.4518" oninput="upPv()"/></div>
<div class="fld ff"><label id="lfn">Note</label><input type="text" id="f-n" placeholder="..."/></div>
</div>
<div class="pvbox"><span id="pv-h">– h</span><span id="pv-ot" style="color:var(--orange)"></span><span id="pv-e">€ –</span></div>
</div>
<div id="off-fields" style="display:none">
<div class="fg">
<div class="fld ff"><label id="lfd2">Data</label><input type="date" id="f-d2"/></div>
<div class="fld ff"><label id="lfn2">Note</label><input type="text" id="f-n2" placeholder="..."/></div>
</div>
</div>
<div class="brow">
<button class="bsave" onclick="saveRow()" id="fm-sv">Salva</button>
<button class="bcancel" onclick="closeForm()" id="fm-ca">Annulla</button>
</div>
</div>
</div>
<div class="ov" id="workers-modal" style="display:none">
<div class="sh">
<div class="handle"></div>
<div class="sh-title" id="wm-t">Lavoratori</div>
<div class="wlist" id="wlist"></div>
<button class="wadd" onclick="showWF()" id="wm-add">＋ Aggiungi</button>
<div id="wf" style="display:none;margin-top:12px">
<div class="fg">
<div class="fld ff"><label id="wfnl">Nome</label><input type="text" id="wf-name"/></div>
<div class="fld ff"><label id="wfrl">€/h</label><input type="number" step="0.0001" id="wf-rate" placeholder="7.4518"/></div>
</div>
<div class="brow" style="margin-top:10px">
<button class="bsave" onclick="addWorker()" id="wfs">Aggiungi</button>
<button class="bcancel" onclick="document.getElementById('wf').style.display='none'" id="wfc">Annulla</button>
</div>
</div>
</div>
</div>
<div class="ov" id="settings-modal" style="display:none">
<div class="sh">
<div class="handle"></div>
<div class="sh-title" id="stg-t">Impostazioni</div>
<div class="stgr"><div id="stg-rl">Tariffa €/h</div><input type="number" step="0.0001" id="stg-rate" class="stgi" value="7.4518"/></div>
<div class="stgr"><div id="stg-sl">Ore ufficiali/giorno</div><input type="number" step="0.5" id="stg-std" class="stgi" value="8"/></div>
<div class="stgr"><div id="stg-otl">Mostra Straordinari</div><label class="tog"><input type="checkbox" id="stg-ot" checked/><span class="tsl"></span></label></div>
<div class="stgr"><div id="stg-thl">Modalità Chiara</div><label class="tog"><input type="checkbox" id="stg-th" onchange="applyTT()"/><span class="tsl"></span></label></div>
<div class="brow" style="margin-top:16px">
<button class="bsave" onclick="saveSettings()" id="stg-sv">Salva</button>
<button class="bcancel" onclick="closeModal('settings-modal')" id="stg-ca">Annulla</button>
</div>
</div>
</div>
<div class="ov" id="backup-modal" style="display:none">
<div class="sh">
<div class="handle"></div>
<div class="sh-title" id="bk-t">Backup</div>
<button class="bbtn bb-exp" onclick="doExport()" id="bk-exp">📤 Esporta JSON</button>
<button class="bbtn bb-imp" onclick="document.getElementById('bkf').click()" id="bk-imp">📥 Importa JSON</button>
<input type="file" id="bkf" accept=".json" style="display:none" onchange="doImport(event)"/>
</div>
</div>
<div class="confirm-ov" id="confirm-ov" style="display:none">
<div class="confirm-box">
<div class="cm" id="confirm-msg">Sei sicuro?</div>
<div class="crow">
<button class="cbtn-ok" id="confirm-ok">Elimina</button>
<button class="cbtn-no" onclick="closeConfirm()">Annulla</button>
</div>
</div>
</div>
<script>
const LSK='af_v5';
function loadS(){try{return JSON.parse(localStorage.getItem(LSK)||'{}')}catch(e){return{}}}
function saveLS(){localStorage.setItem(LSK,JSON.stringify(S))}
let S=loadS();
if(!S.workers)S.workers=[{id:'w1',name:'Ahmed Farag',rate:7.4518}];
if(!S.activeWorker)S.activeWorker=S.workers[0].id;
if(!S.data)S.data={};
if(!S.settings)S.settings={stdHours:8,showOT:true};
if(!S.lang)S.lang='it';
if(!S.theme)S.theme='dark';
